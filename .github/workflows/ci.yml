name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The embedded base context still matches the specification
        env:
          UPSTREAM: https://raw.githubusercontent.com/ards-project/ard-spec/main/spec/schemas/ard.context.jsonld
        run: |
          curl -fsSL "$UPSTREAM" -o upstream.jsonld
          for copy in context_base.json testdata/ard.context.jsonld; do
            diff <(jq -S . "$copy") <(jq -S . upstream.jsonld) \
              || { echo "$copy has drifted from $UPSTREAM"; exit 1; }
          done
